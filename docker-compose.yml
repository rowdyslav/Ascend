services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ascend
      DEFAULT_USER_ID: 64b000000000000000000001
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      ASCEND_API_URL: http://api:8000
    ports:
      - "8550:8550"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - ./frontend/main.py:/app/main.py
      - ./frontend/screens:/app/screens
      - ./frontend/components:/app/components
      - ./frontend/api_client.py:/app/api_client.py
      - ./frontend/theme.py:/app/theme.py
      - ./frontend/assets:/app/assets
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app

volumes:
  mongo_data:
